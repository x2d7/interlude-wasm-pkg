name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # release job creates the release + uploads the asset

jobs:
  # Build the owner wasm and run every test harness. Runs on PRs, pushes to
  # main, AND tag pushes — so the release below is gated on a green test run.
  # The harnesses build into tests/ (owner.wasm + wasm_exec.js live there) and
  # each exits non-zero on failure, so a red harness fails the job.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build owner wasm
        run: |
          GOOS=js GOARCH=wasm go build -o tests/owner.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" tests/wasm_exec.js
      - name: Run harnesses
        run: |
          node tests/harness.mjs
          node tests/harness2.mjs
          node tests/harness3.mjs

  # On a version tag: package the built wasm (owner.wasm + wasm_exec.js +
  # VERSION) and publish it as a release asset. Runs only after `test` is green.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build owner wasm
        run: |
          GOOS=js GOARCH=wasm go build -o tests/owner.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" tests/wasm_exec.js
      - name: Package + publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          mkdir -p dist/stage
          cp tests/owner.wasm tests/wasm_exec.js dist/stage/
          echo "${VER}" > dist/stage/VERSION
          ( cd dist/stage && zip -r "../interlude-wasm-owner-${VER}.zip" owner.wasm wasm_exec.js VERSION )
          gh release create "${VER}" \
            --title "wasm owner ${VER}" \
            --notes "Prebuilt wasm owner artifact (owner.wasm + wasm_exec.js) built from ${VER}." \
            "dist/interlude-wasm-owner-${VER}.zip"
